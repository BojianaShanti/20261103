<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Five Basic Elements – Ice Breaker Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2622;--paper:#f6eedb;--paper2:#efe3c8;--blue:#0b6a99;--orange:#c04a14;--desk:#8a6a47;--panel:#fbf6e8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--desk);color:var(--ink);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 38px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 9px)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;flex:none;transform-origin:center center;position:relative;background:
radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.35),transparent 70%),
repeating-linear-gradient(0deg,transparent 0 35px,rgba(90,120,160,.13) 35px 36px),var(--paper);
border-radius:6px 14px 8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 90px rgba(150,110,50,.22);overflow:hidden}
#stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:46px;background:radial-gradient(circle at 23px 18px,#5a4a3a 0 7px,#c9bfa8 8px 10px,transparent 11px) 0 0/46px 52px;opacity:.85;z-index:3}
.tape{position:absolute;width:120px;height:34px;background:rgba(255,222,120,.7);border:1px solid rgba(160,130,40,.25);z-index:3}
.t1{top:-6px;right:70px;transform:rotate(4deg)}.t2{bottom:-8px;right:150px;transform:rotate(-3deg)}
svg{position:absolute;inset:0;width:1280px;height:720px}
.title{font-family:Caveat,"Patrick Hand",cursive;font-size:54px;font-weight:700;fill:var(--ink)}
.main,.sub,.oil,.title{paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}
.main{font-size:38px;font-weight:700;fill:var(--ink)}.sub{font-size:34px;fill:var(--blue);font-family:Caveat,"Patrick Hand",cursive;font-weight:600}
.oil{font-size:27px;font-weight:700;fill:var(--blue)}.tag{font-size:29px;font-weight:700;fill:var(--orange)}
.node{font-family:Caveat,"Patrick Hand",cursive;font-size:40px;font-weight:700;text-anchor:middle}
.pg{font-size:22px;fill:#7a6a55}
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#e9dcbc;border-top:3px solid #5a4a3a;font-size:20px}
#bar button{font:inherit;padding:4px 16px;border:2px solid var(--ink);border-radius:10px 14px 9px 13px;background:var(--panel);color:var(--ink);cursor:pointer}
#bar button:hover,#bar button:focus-visible{background:#ffe9a8;outline:none}
#bar .sp{flex:1}
#notes{background:var(--panel);border-top:2px dashed #8a7a5a;padding:12px 22px;max-height:36vh;overflow:auto;font-size:21px;line-height:1.45}
#notes[hidden]{display:none}#notes h2{margin:0 0 4px;font-size:20px;color:var(--orange);font-weight:400}
#notes p{margin:0 0 .6em}#notes .h{font-family:Caveat,cursive;font-size:30px;font-weight:700;color:var(--orange);margin:.9em 0 .2em}#notes .t{font-weight:700;margin:.8em 0 .15em}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><i class="tape t1"></i><i class="tape t2"></i><svg id="svg" viewBox="0 0 1280 720" role="img" aria-label="Five elements diagram"></svg></div></div>
<div id="bar"><button id="prev" aria-label="Previous slide">◀ Prev</button><button id="next" aria-label="Next slide">Next ▶</button><span id="count"></span><span class="sp"></span><button id="tg" aria-pressed="true">Speaker notes (N)</button></div>
<div id="notes" aria-live="polite"></div>
<script>
const NS="http://www.w3.org/2000/svg";
const E={wood:{n:"Wood",x:320,y:360,f:"#4aa52e",t:"#fff"},fire:{n:"Fire",x:640,y:140,f:"#e8231a",t:"#fff"},gold:{n:"Gold",x:960,y:360,f:"#ffffff",t:"#2a2622"},earth:{n:"Earth",x:640,y:360,f:"#c9a400",t:"#2a2622"},water:{n:"Water",x:640,y:580,f:"#111111",t:"#fff"}};
// label anchors: [x,y,anchor]
const P={fire:[640,52,"middle"],wood:[246,352,"end"],gold:[1034,352,"start"],water:[640,694,"middle"],earth:[738,212,"start"]};
const SUBP={fire:[736,112,"start"],wood:[246,396,"end"],gold:[1034,396,"start"],water:[736,624,"start"],earth:[738,248,"start"]};
const slides=[
{title:"The Five Basic Elements",notes:["Before we reveal the answer, we need to categorize the five groups. In other words, we need to understand what the five basic elements are and what theory lies behind them. Why is this important? By knowing your Chinese zodiac sign, you will have the key to unlocking your congenital constitution. And by combining it with the season you were born in, you will get a better idea of which elements you have in your body and what you can do to bring them back into balance. Isn’t it amazing? The more I study it, the more I find that it still fits quite well today! This theory is called Wu Yun Liu Qi, and it can be traced back 2,500 years to ancient China. It is wisdom developed over generations. The better you understand your congenital constitution, the more easily you can discover your hidden strengths and what suits you. This is similar to why we are here today: by knowing our strengths and capacities, we will find our way.", "So, let’s begin!"]},
{title:"Outer Environment",main:{fire:"Summer",earth:"Long Summer",gold:"Autumn",water:"Winter",wood:"Spring"},sub:{fire:"Heat",earth:"Dampness",gold:"Dryness",water:"Cold",wood:"Wind"},notes:["Have you ever heard the saying, “The Tao gives birth to one; one gives birth to two; two gives birth to three; and three gives birth to all things”? For those who don’t know it, this line comes from the classic “Tao Te Ching,” which is attributed to Laozi. It explains how ancient Chinese society understood the way the world is generated and how it runs. It applies not only to the outer environment but also to the inner environment, which is the human body. To keep it simple, we can think of the core value as “circulation”: life is a cycle.", "Let’s begin with the outer environment, which is the seasons of the year and the circulation of temperature, starting with winter."]},
{title:"Inner Environment",main:{fire:"Heart",earth:"Spleen",gold:"Lungs",water:"Kidney",wood:"Liver"},sub:{fire:"Joy",earth:"Overthinking",gold:"Grief",water:"Fear",wood:"Anger"},extra:{earth:["Stomach"]},notes:["Each element also represents a different organ in the human body and, at the same time, an emotion. Let’s take Wood as an example. Spring is naturally a season of growth and renewal, so liver qi needs to rise. But when anger or other factors cause your liver qi to stagnate, you end up feeling quite unhappy, and you may run into problems with your liver or even your eyes. For the liver, it is therefore very important to keep things flowing and allow the liver qi to disperse properly.", "Another important area I want to talk about is the spleen and stomach. I believe everybody here knows the saying, “You are what you eat.” The spleen and stomach are the foundation of the acquired constitution. They keep your circulation system moving. When this area is stuck, the elements can’t communicate well with each other. But of course, all the elements are important, and each serves a different function."]},
{title:"Answer Reveal",main:{fire:"Mouse, Tiger, Horse, Monkey",earth:"Ox, Goat",gold:"Rabbit, Rooster",water:"Dragon, Dog",wood:"Snake, Pig"},notes:["This is the answer reveal for our ice breaker game. Let’s see which animals belong to which element. Did you get it right?"]},
{title:"Essential Oils",main:{fire:"Mouse, Tiger, Horse, Monkey",earth:"Ox, Goat",gold:"Rabbit, Rooster",water:"Dragon, Dog",wood:"Snake, Pig"},oils:{
 fire:{tag:"Resin",lines:["Benzoin, Frankincense,","Myrrh, Galbanum"],pos:[722,48,"start"]},
 earth:{tag:"Berries/Seeds",lines:["Litsea/May Chang,","Nutmeg"],pos:[1000,177,"start"]},
 wood:{tag:"Wood",lines:["Ho Leaf,","Black Spruce"],pos:[246,232,"end"]},
 gold:{tag:"Flower",lines:["Osmanthus,","Wild Chrysanthemum"],pos:[1034,400,"start"]},
 water:{tag:"Root",lines:["Spikenard,","Angelica Root"],pos:[548,622,"end"]}},
 notes:["Here is more information for further study. These essential oils represent each animal. And since smell is the only sense that links directly to the brain’s emotional and memory center, essential oils are especially powerful.", "## Wood for “Wood”", "It’s a very energetic group. Endowed with great vitality, it keeps growing upward.", "# (Ho Leaf) Snake: Same name, different scent profile. Good for GABA-type insomnia.", "Did you know that this plant is actually the same kind of plant used in mothballs for the closet? They share the same Latin name, but the smell is very different. Ho Leaf is an eco-friendly alternative to endangered rosewood. Some people are fully occupied during the day, and the night is the only time they can control, so they don’t want to go to bed too early. Or their brain simply can’t stop working. If that sounds like you, this is a good essential oil to use.", "# (Black Spruce) Pig: Fresh air in a cold and windy place.", "This essential oil is safe for children to use. It helps stimulate you by boosting your adrenaline, and it is also great for the respiratory system. Simply put, it provides energy and vitality, making it an excellent choice when you are feeling fatigued.", "## Resin for “Fire”", "Resins are known for their strong diffusion and their powerful healing properties for trauma. This is because a tree produces resin as a way to heal its own wounds, and we use that secretion to help mend our own injuries. So, if you smell resinous essential oils, you’ll notice their energy moving upward. You can feel the scent rising toward your head, which truly represents the Fire element. And why are there four animals in Fire? That’s because the mouse and the horse belong to Sovereign Fire, and the tiger and the monkey belong to Ministerial Fire. I will explain more in future articles on the website.", "# (Benzoin) Mouse: A comfort blanket, your safety net", "Did you know that many resins originate from Southeast Asia? Benzoin is one of them. In Malay we call it kemenyan, and it is famous for its long-lasting scent, which serves as a fixative in the perfume industry.", "# (Frankincense) Tiger: One of the gifts from the Magi in the Bible", "Frankincense is probably the most famous resin in the world and is widely used in many cultures, both Eastern and Western. It’s a great choice when you want to cleanse the aura of yourself or of things like crystals.", "# (Myrrh) Horse: The “red tears” in Greek myths", "The name Myrrh comes from the story of Princess Myrrha, the mother of Adonis, the god of beauty, desire and rebirth. For people who have experienced physical abuse, this is a good essential oil for healing.", "# (Galbanum) Monkey: A fragrance for German philosophers", "For someone who has PTSD or has been through a very difficult time, Galbanum is a good choice. Here is a little riddle: why is Galbanum good for a German philosopher? In German it is called “Mutterharz,” which means “mother’s resin,” and people say Germany has produced so many philosophers because Germans tend to think too much. If you are bothered by monkey mind, please give Galbanum a try.", "## Berries/Seeds for “Earth”", "Do you feel hungrier when you smell these two essential oils? They are both famous for helping with digestive problems.", "# (Litsea) Ox: Little berries that calm the mind, famous in indigenous Taiwanese communities", "If your digestive issues are caused by emotions, Litsea is for you. It is also a great ingredient for cooking chicken soup.", "# (Nutmeg) Goat: Once upon a time, it was more expensive than gold", "But did you know that nutmeg was not only more expensive than gold, but was once worth an entire island, Manhattan? It was the absolute protagonist of the Spice War. You can still see this history today at Fort Canning Park in Singapore, where nutmeg trees are everywhere. The Nutmeg Mania!", "## Flower for “Gold”", "Although autumn is cool, some flowers still blossom in the season. The flowers below are both representative of the season and good for the lungs!", "# (Osmanthus) Rabbit: It comes from a tree that can never be cut down", "This is a famous Chinese story: Wu Gang chopping down the tree, which is the osmanthus on the moon. In the meantime, the rabbits are also pounding the elixir of immortality up there.", "# (Wild Chrysanthemum) Rooster: A great firefighter for your body", "Chrysanthemum is one of the most widely used flowers nowadays. If you feel your eyes are “burning,” you can try adding chrysanthemum and goji berries.", "## Root for “Water”", "Most plant roots are underground, so, as you can imagine, essential oils extracted from this part are expected to carry grounding energy. When you want to feel supported, roots are your friends.", "# (Spikenard) Dragon: The energy that connects sky and ground", "Spikenard comes from the Himalayan region and is hard to harvest, so it is very precious. In the Bible, there is a story about Mary of Bethany using spikenard to anoint Jesus’ feet. And in China, Taoists have often used this ingredient to make what is known as aura-cleansing incense.", "# (Angelica Root) Dog: Different purposes for the head, body and tail", "Did you know that each part of the Angelica root has a different function?", "Angelica head (short and thick) → Symbolizes the “source of blood production.” Its function leans toward “stopping bleeding and directing blood upward,” serving to anchor the primary source and lift the pure Yang Qi.", "Angelica body (thick main root) → Symbolizes the “organ for blood storage.”", "Angelica tail (slender fine roots) → Symbolizes the “collaterals for blood circulation.”"]}
];
const svg=document.getElementById("svg");
function el(t,a,txt,p=svg){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function text(s,x,y,anchor,cls){return el("text",{x,y,"text-anchor":anchor,class:cls},s)}
function build(i){
 svg.innerHTML="";const S=slides[i];
 const d=el("defs",{});
 d.innerHTML=`<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
 <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
 <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#2a2622"/></marker>
 <marker id="ao" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#d8602a"/></marker>
 <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(0,0,0,.18)" stroke-width="2"/></pattern>`;
 const g=el("g",{filter:"url(#rough)"});
 const ar=(dd)=>{el("path",{d:dd,fill:"none",stroke:"#2a2622","stroke-width":3.5,"stroke-linecap":"round","marker-end":"url(#ah)"},null,g)};
 // outer generating cycle
 ar("M320 292 Q322 142 566 140");ar("M714 140 Q958 142 960 290");ar("M960 430 Q958 578 714 580");ar("M566 580 Q322 578 320 430");
 // inner Earth cycle
 ar("M572 452 A104 104 0 0 1 572 268");ar("M708 268 A104 104 0 0 1 708 452");
 // nodes
 for(const k in E){const e=E[k];
  el("circle",{cx:e.x+2,cy:e.y+3,r:62,fill:e.f,stroke:"#2a2622","stroke-width":4},null,g);
  el("circle",{cx:e.x+2,cy:e.y+3,r:62,fill:"url(#hatch)",opacity:k==="gold"?.5:.35},null,g);
  el("circle",{cx:e.x-3,cy:e.y-2,r:64,fill:"none",stroke:"#2a2622","stroke-width":1.6,opacity:.7},null,g);
 }
 for(const k in E){const e=E[k];el("text",{x:e.x,y:e.y+13,class:"node",fill:e.t},e.n)}
 // titles & labels
 if(S.title){if(S.title.length>20){text("The Five Basic",70,100,"start","title");text("Elements",70,156,"start","title")}else text(S.title,70,118,"start","title")}
 if(S.main){const L=el("g",{filter:"url(#rough2)"});
  for(const k in S.main){let [x,y,a]=P[k];if(S.extra&&k==="earth")[x,y,a]=[488,262,"end"];if(S.oils){if(k==="fire")[x,y,a]=[700,48,"end"];if(k==="water")[x,y,a]=[736,624,"start"];if(k==="earth")[x,y,a]=[1000,140,"start"];}
   if(S.oils&&k==="earth"){/* handled below */}
   text(S.main[k],x,y,a,"main");
   if(S.sub&&S.sub[k]){const[sx,sy,sa]=SUBP[k];text(S.sub[k],sx,sy,sa,"sub");
    const ay=k==="fire"||k==="water"?sy-8:sy-8;
    if(k==="fire"||k==="water")el("path",{d:`M${sx-14} ${sy-8} L${sx-52} ${sy-8}`,stroke:"#1a86b8","stroke-width":2.5,fill:"none","marker-start":"url(#ao)"},null,L).setAttribute("marker-start","");}
  }
  if(S.extra&&S.extra.earth){text("Stomach",738,494,"start","main");}
  // Earth leader line (slides 2-4)
  if(!S.oils&&S.main.earth)el("path",{d:"M690 332 Q722 296 738 232",fill:"none",stroke:"#2a2622","stroke-width":2.2,"stroke-dasharray":"2 7","stroke-linecap":"round"},null,L);
 }
 if(S.oils){const L=el("g",{filter:"url(#rough2)"});
  for(const k in S.oils){const o=S.oils[k],[x,y,a]=o.pos,w=o.tag.length*17+34,bx=a==="end"?x-w:x;
   el("rect",{x:bx,y:y-30,width:w,height:42,rx:4,fill:"rgba(255,255,255,.55)",stroke:"#d8602a","stroke-width":2.2},null,L);
   text(o.tag,a==="end"?x-w/2:x+w/2,y,"middle","tag");
   o.lines.forEach((t,j)=>text(t,x,y+40+j*33,a,"oil"));}
  el("path",{d:"M692 328 Q850 268 992 150",fill:"none",stroke:"#2a2622","stroke-width":2.2,"stroke-dasharray":"2 7","stroke-linecap":"round"},null,L);
 }
 svg.querySelectorAll("text.main,text.sub,text.oil,text.title").forEach(t=>{let fs=parseFloat(getComputedStyle(t).fontSize),b=t.getBBox(),n=0;while((b.x+b.width>1262||b.x<54)&&n++<14){fs-=2;t.style.fontSize=fs+"px";b=t.getBBox()}});
 text(`${i+1} / ${slides.length}`,1190,700,"end","pg");
 document.getElementById("notes").innerHTML=`<h2>Speaker notes – slide ${i+1}</h2>`+S.notes.map(n=>n.startsWith("## ")?`<div class="h">${n.slice(3)}</div>`:n.startsWith("# ")?`<p class="t">${n.slice(2)}</p>`:`<p>${n}</p>`).join("");
 document.getElementById("count").textContent=`Slide ${i+1} of ${slides.length}`;
 document.title=(S.title||"Essential oils")+" – The Five Basic Elements";
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));build(cur);history.replaceState(null,"","#"+(cur+1));fit()}
function fit(){const w=document.getElementById("wrap"),s=document.getElementById("stage");const k=Math.min((w.clientWidth-24)/1280,(w.clientHeight-24)/720);s.style.transform=`scale(${k})`;s.style.margin=`${(720*k-720)/2}px ${(1280*k-1280)/2}px`}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
const nt=document.getElementById("notes"),tg=document.getElementById("tg");
function toggle(){nt.hidden=!nt.hidden;tg.setAttribute("aria-pressed",String(!nt.hidden));fit()}
tg.onclick=toggle;
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}else if(["ArrowLeft","PageUp"].includes(e.key))go(cur-1);else if(e.key==="Home")go(0);else if(e.key==="End")go(slides.length-1);else if(e.key==="n"||e.key==="N")toggle()});
addEventListener("resize",fit);
new ResizeObserver(fit).observe(document.getElementById("wrap"));
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
